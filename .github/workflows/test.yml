name: Test PostgreSQL Versions

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        postgres-version: ['13', '14', '15', '16', '17', '18', '19beta2']
      fail-fast: false
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Start PostgreSQL
      run: |
        docker run --detach \
          --name postgres-dba-test \
          --env POSTGRES_PASSWORD=postgres \
          --env POSTGRES_DB=test \
          --env POSTGRES_HOST_AUTH_METHOD=trust \
          --env POSTGRES_INITDB_ARGS='--auth-host=trust --auth-local=trust' \
          --publish 127.0.0.1:5432:5432 \
          postgres:${{ matrix.postgres-version }} \
          -c shared_preload_libraries=pg_stat_statements
    
    - name: Install PostgreSQL client
      run: |
        sudo apt-get update
        sudo apt-get install -y postgresql-client
        psql --version
    
    - name: Prepare test database
      run: |
        ready=false
        for _ in {1..30}; do
          if pg_isready --host=localhost --port=5432 --username=postgres; then
            ready=true
            break
          fi
          echo "Waiting for postgres..."
          sleep 2
        done
        if [[ "${ready}" != true ]]; then
          docker logs postgres-dba-test
          exit 1
        fi

        server_version=$(PAGER='cat' psql \
          --no-psqlrc \
          --host=localhost \
          --username=postgres \
          --dbname=test \
          --tuples-only \
          --no-align \
          --command='show server_version;')
        echo "PostgreSQL ${server_version}"
        if [[ "${server_version}" != '${{ matrix.postgres-version }}'* ]]; then
          echo "Expected PostgreSQL ${{ matrix.postgres-version }}, got ${server_version}" >&2
          exit 1
        fi

        # Extensions
        PAGER='cat' psql \
          --no-psqlrc \
          --set=ON_ERROR_STOP=1 \
          --host=localhost \
          --username=postgres \
          --dbname=test <<'SQL'
        create extension if not exists pg_stat_statements;
        create extension if not exists pgstattuple;
        create extension if not exists intarray;
        create extension if not exists pg_buffercache;
        create extension if not exists amcheck;
        -- amcheck needs execute privileges for non-superusers
        grant execute on all functions in schema public to public;

        -- Minimal privilege user
        create user dba_user;
        grant pg_monitor to dba_user;
        grant connect on database test to dba_user;
        grant usage on schema public to dba_user;

        -- Test tables for alignment (p1)
        create table align1 as
        select 1::int4, 2::int8, 3::int4 as more
        from generate_series(1, 100000) _(i);
        create table align2 as
        select 1::int4, 3::int4 as more, 2::int8
        from generate_series(1, 100000) _(i);

        -- Test tables for foreign key check (i3) — with intarray to catch operator ambiguity
        create table fk_parent (id int primary key, data text);
        create table fk_child (
          id int primary key,
          parent_id int,
          data text,
          constraint fk_test foreign key (parent_id) references fk_parent(id)
        );
        insert into fk_parent
        select i, 'data_' || i from generate_series(1, 100000) i;
        insert into fk_child
        select i, (i % 100000) + 1, 'data_' || i
        from generate_series(1, 200000) i;
        analyze;

        -- Grant access
        grant select on all tables in schema public to dba_user;
        SQL

        PAGER='cat' psql \
          --no-psqlrc \
          --set=ON_ERROR_STOP=1 \
          --host=localhost \
          --username=dba_user \
          --dbname=test \
          --command='select current_user, session_user;'
    
    - name: Test non-interactive reports
      run: |
        echo "Testing all non-interactive reports with minimal privileges..."
        for report in ./sql/*.sql; do
          if [[ "${report}" == ./sql/r1_* || "${report}" == ./sql/r2_* ]]; then
            continue
          fi
          echo "  Testing ${report}..."
          if ! output=$(PAGER='cat' psql \
            --no-psqlrc \
            --set=ON_ERROR_STOP=1 \
            --set=postgres_dba_interactive_mode=false \
            --host=localhost \
            --username=dba_user \
            --dbname=test \
            --file=warmup.psql \
            --file="${report}" 2>&1); then
            echo "FAILED: ${report}" >&2
            echo "${output}" >&2
            exit 1
          fi
        done
        echo "All non-interactive reports passed"

    - name: Test interactive role reports
      run: |
        if ! printf 'ci_test_role\n0\n1\n' | PAGER='cat' psql \
          --no-psqlrc \
          --set=ON_ERROR_STOP=1 \
          --host=localhost \
          --username=postgres \
          --dbname=test \
          --file=sql/r1_create_user_with_random_password.sql \
          >/dev/null 2>&1; then
          echo 'Create-role report failed; output suppressed because it contains a password' >&2
          exit 1
        fi

        role_state=$(PAGER='cat' psql \
          --no-psqlrc \
          --set=ON_ERROR_STOP=1 \
          --host=localhost \
          --username=postgres \
          --dbname=test \
          --tuples-only \
          --no-align \
          --command="select rolsuper, rolcanlogin, rolpassword is not null
                     from pg_authid
                     where rolname = 'ci_test_role';")
        if [[ "${role_state}" != 'f|t|t' ]]; then
          echo "Unexpected created role state: ${role_state}" >&2
          exit 1
        fi

        old_password_digest=$(PAGER='cat' psql \
          --no-psqlrc \
          --set=ON_ERROR_STOP=1 \
          --host=localhost \
          --username=postgres \
          --dbname=test \
          --tuples-only \
          --no-align \
          --command="select md5(rolpassword) from pg_authid
                     where rolname = 'ci_test_role';")

        if ! printf 'ci_test_role\n0\n1\n' | PAGER='cat' psql \
          --no-psqlrc \
          --set=ON_ERROR_STOP=1 \
          --host=localhost \
          --username=postgres \
          --dbname=test \
          --file=sql/r2_alter_user_with_random_password.sql \
          >/dev/null 2>&1; then
          echo 'Alter-role report failed; output suppressed because it may contain a password' >&2
          exit 1
        fi

        new_password_digest=$(PAGER='cat' psql \
          --no-psqlrc \
          --set=ON_ERROR_STOP=1 \
          --host=localhost \
          --username=postgres \
          --dbname=test \
          --tuples-only \
          --no-align \
          --command="select md5(rolpassword) from pg_authid
                     where rolname = 'ci_test_role';")
        if [[ -z "${old_password_digest}" \
          || -z "${new_password_digest}" \
          || "${old_password_digest}" == "${new_password_digest}" ]]; then
          echo 'Alter-role report did not rotate the password' >&2
          exit 1
        fi
    
    - name: Run regression tests
      run: |
        echo "Running regression tests with minimal privileges..."

        echo "  Testing 0_node.sql..."
        if ! output=$(PAGER='cat' psql \
          --no-psqlrc \
          --set=ON_ERROR_STOP=1 \
          --set=postgres_dba_interactive_mode=false \
          --host=localhost \
          --username=dba_user \
          --dbname=test \
          --file=warmup.psql \
          --file=sql/0_node.sql 2>&1); then
          echo "${output}" >&2
          exit 1
        fi
        role_line=$(printf '%s\n' "${output}" | grep -E '^[[:space:]]*Role[[:space:]]*\|')
        if [[ "${role_line}" != *Primary* ]]; then
          echo "Role test failed: ${output}" >&2
          exit 1
        fi

        echo "  Testing x1_alignment_padding.sql..."
        if ! output=$(PAGER='cat' psql \
          --no-psqlrc \
          --set=ON_ERROR_STOP=1 \
          --set=postgres_dba_interactive_mode=false \
          --host=localhost \
          --username=dba_user \
          --dbname=test \
          --file=warmup.psql \
          --file=sql/x1_alignment_padding.sql 2>&1); then
          echo "${output}" >&2
          exit 1
        fi
        if [[ "${output}" != *align1* \
          || "${output}" != *align2* \
          || "${output}" != *'int4, more, int8'* ]]; then
          echo "Alignment padding test failed: ${output}" >&2
          exit 1
        fi

        echo "  Testing a1_activity.sql..."
        if ! output=$(PAGER='cat' psql \
          --no-psqlrc \
          --set=ON_ERROR_STOP=1 \
          --set=postgres_dba_interactive_mode=false \
          --host=localhost \
          --username=dba_user \
          --dbname=test \
          --file=warmup.psql \
          --file=sql/a1_activity.sql 2>&1); then
          echo "${output}" >&2
          exit 1
        fi
        if [[ "${output}" != *dba_user* ]]; then
          echo "Activity test failed: ${output}" >&2
          exit 1
        fi

        echo "  Testing i3_non_indexed_fks.sql (with intarray extension)..."
        if ! output=$(PAGER='cat' psql \
          --no-psqlrc \
          --set=ON_ERROR_STOP=1 \
          --set=postgres_dba_interactive_mode=false \
          --host=localhost \
          --username=dba_user \
          --dbname=test \
          --file=warmup.psql \
          --file=sql/i3_non_indexed_fks.sql 2>&1); then
          echo "${output}" >&2
          exit 1
        fi
        if [[ "${output}" != *fk_child* || "${output}" != *fk_test* ]]; then
          echo "i3 test failed: ${output}" >&2
          exit 1
        fi

        echo "All regression tests passed with minimal privileges"

    - name: Stop PostgreSQL
      if: always()
      run: docker rm --force postgres-dba-test
